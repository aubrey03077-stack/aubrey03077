<title>乌拉圭 2027 上半年促销日历</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: 单张图——标题 + 1–6 月按行排列的节点时间轴 + 图例 */
:root{
  --bg:#f5f8fb; --surface:#ffffff; --fg:#14202b; --muted:#5b6b79; --line:#dde5ec;
  --a:#2b7bc0; --b:#d99a12; --c:#9aa3ab; --s:#c8442f;
  --display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --surface:#16212c; --fg:#e6edf3; --muted:#9aaab8; --line:#283745;
  --a:#6fb1ea; --b:#f0b84a; --c:#7d8791; --s:#ef7a64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#16212c; --fg:#e6edf3; --muted:#9aaab8; --line:#283745;
  --a:#6fb1ea; --b:#f0b84a; --c:#7d8791; --s:#ef7a64; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.chart{min-width:960px;padding:24px 24px 18px}
h1{font-family:var(--display);font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 18px}
.grid{display:grid;grid-template-columns:200px 1fr}
.lab{padding:7px 12px 7px 0;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--line);min-width:0}
.lab b{font-weight:700}
.lab span{color:var(--muted);font-size:12px}
.trk{position:relative;border-bottom:1px solid var(--line);height:48px}
.hd .trk,.hd.lab{height:34px;border-bottom:2px solid var(--fg)}
.m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.hd .m{border-left-color:transparent;font-family:var(--display);font-weight:700;padding:6px 8px;font-size:15px}
.bar{position:absolute;top:15px;height:18px;border-radius:4px;box-sizing:border-box;min-width:6px}
.bar.A{background:var(--a)} .bar.B{background:var(--b);color:#2a1d00} .bar.C{background:var(--c)}
.bar.est{background:repeating-linear-gradient(45deg,var(--a) 0 5px,color-mix(in srgb,var(--a) 60%,transparent) 5px 10px)}
.pt{position:absolute;top:17px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);border:2px solid var(--surface)}
.pt.A{background:var(--a)}.pt.B{background:var(--b)}.pt.C{background:var(--c)}.pt.S{background:var(--s)}
.dt{position:absolute;top:15px;font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:18px}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .d{width:10px;height:10px;transform:rotate(45deg);border-radius:0;background:var(--s)}
</style>

<div class="wrap"><div class="card"><div class="chart" id="chart">
  <h1>乌拉圭 2027 上半年 电子消费促销时间轴</h1>
  <p class="sub">1–6 月节日与促销节点 · 红色◆为销售峰值日</p>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><i style="background:var(--a)"></i>重点促销</span>
    <span><i style="background:var(--b)"></i>次级促销 / 消费拉动</span>
    <span><i style="background:var(--c)"></i>淡季 / 出游</span>
    <span><i class="est" style="background:repeating-linear-gradient(45deg,var(--a) 0 4px,transparent 4px 8px);border:1px solid var(--a)"></i>日期为预估，待官方公布</span>
    <span><i class="d"></i>峰值日</span>
  </div>
</div></div></div>

<script>
const D=s=>new Date(s+"T00:00:00");
const S=D("2027-01-01"),E=D("2027-07-01"),SPAN=(E-S)/864e5;
const p=d=>Math.max(0,Math.min(100,(d-S)/864e5/SPAN*100));
const md=s=>{const d=D(s);return `${d.getMonth()+1}/${d.getDate()}`};
const items=[
 {n:"三王节（儿童礼物）",es:"Día de Reyes",t:"A",s:"2027-01-01",e:"2027-01-06",pk:"2027-01-06",lbl:"12/28 起 – 1/6"},
 {n:"夏季旅游季",es:"Temporada de verano",t:"C",s:"2027-01-07",e:"2027-02-07",lbl:"1月中 – 2月初"},
 {n:"狂欢节",es:"Carnaval",t:"C",s:"2027-02-08",e:"2027-02-09",lbl:"2/8 – 2/9"},
 {n:"情人节",es:"Día de los Enamorados",t:"B",pt:"2027-02-14"},
 {n:"三星旗舰新机上市",es:"Galaxy S（预计 2 月）",t:"B",s:"2027-02-15",e:"2027-02-28",est:1,lbl:"预售 / 上一代降价"},
 {n:"开学季",es:"Vuelta a clases",t:"B",s:"2027-02-15",e:"2027-03-07",pk:"2027-03-01",lbl:"2/15 – 3/7"},
 {n:"旅游周（复活节）",es:"Semana de Turismo",t:"C",s:"2027-03-22",e:"2027-03-28",lbl:"3/22 – 3/28"},
 {n:"母亲节",es:"Día de la Madre",t:"A",s:"2027-04-26",e:"2027-05-09",pk:"2027-05-09",lbl:"4/26 – 5/9"},
 {n:"CEDU 网购节 上半年",es:"Ciberlunes（日期预估）",t:"A",s:"2027-06-07",e:"2027-06-09",est:1,pk:"2027-06-07",lbl:"约 6 月上旬"},
 {n:"年中第13薪发放",es:"Aguinaldo (1ª cuota)",t:"B",s:"2027-06-15",e:"2027-06-30",lbl:"6 月下旬"},
 {n:"父亲节预热",es:"Día del Padre · 7/11",t:"A",s:"2027-06-28",e:"2027-06-30",lbl:"6/28 起 → 7/11"},
];
let h=`<div class="lab hd"></div><div class="trk hd">`;
for(let m=0;m<6;m++){const d=new Date(2027,m,1);h+=`<div class="m" style="left:${p(d)}%">${m+1}月</div>`}
h+=`</div>`;
const lines=()=>{let s="";for(let m=0;m<6;m++)s+=`<div class="m" style="left:${p(new Date(2027,m,1))}%"></div>`;return s};
items.forEach(i=>{
  h+=`<div class="lab"><b>${i.n}</b><span>${i.es}</span></div><div class="trk">${lines()}`;
  if(i.pt){h+=`<div class="pt ${i.t}" style="left:${p(D(i.pt))+50/SPAN}%"></div><div class="dt" style="left:calc(${p(D(i.pt))}% + 14px)">${md(i.pt)}</div>`}
  else{
    const l=p(D(i.s)),w=p(new Date(D(i.e).getTime()+864e5))-l;
    h+=`<div class="bar ${i.t}${i.est?" est":""}" style="left:${l}%;width:${w}%"></div>`;
    const right=l+w>82;
    h+=`<div class="dt" style="${right?`right:calc(${100-l}% + 12px)`:`left:calc(${l+w}% + 16px)`}">${i.lbl}</div>`;
    if(i.pk)h+=`<div class="pt S" style="left:${p(D(i.pk))+50/SPAN}%"></div>`;
  }
  h+=`</div>`;
});
document.getElementById("grid").innerHTML=h;
</script>
